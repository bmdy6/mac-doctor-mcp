name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.8"
          python-version: "3.12"
      - run: uv run pytest -q
